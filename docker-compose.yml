version: "3.8"
services:
  postgres:
    image: postgis/postgis:15-3.3 # Postgres + PostGIS for spatial queries (driver GPS)
    container_name: foodengine_user
    environment:
      POSTGRES_USER: foodengine_user
      POSTGRES_PASSWORD: foodengine_secret
      POSTGRES_DB: foodengine_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine # In-memory store for geospatial driver tracking & BullMQ
    container_name: foodengine_redis
    ports:
      - "6379:6379"
volumes:
  postgres_data:
